name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: xavierfenaux-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 -H 76.13.48.6 >> ~/.ssh/known_hosts || true

      - name: Deploy website
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.well-known/acme-challenge' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            www/ root@76.13.48.6:/var/www/xavierfenaux/
