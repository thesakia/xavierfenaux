server {
    if ($ft_services_retired) { return 410; }
    server_name ftfenaux.com www.ftfenaux.com;
    include /etc/nginx/snippets/hookcook.conf;

    # Page en construction (racine)
    root /var/www/ftfenaux;
    include /etc/nginx/snippets/clips.conf;
    include /etc/nginx/snippets/glp1-master.conf;
    include /etc/nginx/snippets/celine.conf;
    include /etc/nginx/snippets/qg-identity.conf;
    include /etc/nginx/snippets/services.conf;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Maison Fenaux — application familiale isolée
    location = /home {
        return 301 /home/;
    }

    location ^~ /home/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    # Tournage IVT — WebSocket + Node
    location ^~ /ivlite/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /ivlite-essentials/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /ivlite-pulse/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /ivlite-signal/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Radiographie notifs IVT (doc interne, non indexe)
    location = /ivnotifs {
        return 301 /ivnotifs/;
    }

    location ^~ /ivnotifs/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /tournageivt { return 410; }

    location ^~ /tournageivt/ { return 410; }

    # Dashboard projets — auth + proxy vers Express

    # Désactivation temporaire des pages Service Compris / Philip / Doo
    location = /servicecompris {
        return 410;
    }

    location ^~ /servicecompris/ {
        return 410;
    }
    location /dashboardprojets/api/ {
        auth_basic "Acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd_dashboard;
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboardprojets/ {
        auth_basic "Acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd_dashboard;
        proxy_pass http://127.0.0.1:3002/dashboardprojets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /servicecompris/PlaquetteServiceCompris/ {
        return 410;
    }

    location ^~ /servicecompris/menu/ {
        return 410;
    }

    location ^~ /servicecompris/questionnaire/ {
        return 410;
    }

    location ^~ /servicecompris/recommander/ {
        return 410;
    }

    location ^~ /servicecompris/307/ {
        return 410;
    }

    location ^~ /servicecompris/analytics-overview/ {
        return 410;
    }

    location ^~ /servicecompris/audit/ {
        return 410;
    }

    location ^~ /servicecompris/booking/ {
        return 410;
    }

    location ^~ /servicecompris/checklist-photos/ {
        return 410;
    }

    location ^~ /servicecompris/lechenevert/ {
        return 410;
    }

    location ^~ /servicecompris/partenaires/ {
        return 410;
    }

    location ^~ /servicecompris/ratb/ {
        return 410;
    }

    location = /servicecompris/test.html {
        return 410;
    }
    # Planning IVT API (statuts partagés)
    location ^~ /planningivt-api/ {
        auth_basic "Planning IVT - Acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd_planningivt;
        proxy_pass http://127.0.0.1:3006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Planning IVT
    location = /planningivt {
        return 301 /planningivt.html;
    }

    location = /planningivt.html {
        auth_basic "Planning IVT - Acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd_planningivt;
        root /var/www/ftfenaux;
        try_files /planningivt.html =404;
    }

    include /etc/nginx/snippets/master.conf;
    include /etc/nginx/snippets/stratsync-csviewer.conf;

    # J'assume sous GLP-1 a demenage sur son propre sous-domaine.
    location ^~ /jassume {
        rewrite ^/jassume(/.*)?$ https://jassume.ftfenaux.com$1 permanent;
    }

    # Cap 3e — API de progression de Jahmélia
    location = /révisions/api {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/cap3e/api.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    include /etc/nginx/snippets/milkquake.conf;
    include /etc/nginx/snippets/maison-capital.conf;
    include /etc/nginx/snippets/glp1.conf;
    include /etc/nginx/snippets/glp1training.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ftfenaux.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ftfenaux.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($ft_services_retired) { return 410; }
    if ($host = www.ftfenaux.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ftfenaux.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ftfenaux.com www.ftfenaux.com;
    return 404; # managed by Certbot
}
