server {
    listen 80;
    server_name xavierfenaux.com www.xavierfenaux.com;

    client_max_body_size 1000m;
    client_body_timeout 600s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 600s;

    location ^~ /dashboard { return 410; }

    location ^~ /_next/ { return 410; }

    location ^~ /api/ { return 410; }

    location = /clips { return 301 /clips/; }

    location ^~ /clips/hooks/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8094/hooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Clips-User "";
        client_max_body_size 100k;
        proxy_read_timeout 30s;
        access_log off;
    }

    location ^~ /clips/ {
        auth_basic "Clips - Studio Morning Mood";
        auth_basic_user_file /etc/nginx/.htpasswd_clips;
        proxy_pass http://127.0.0.1:8094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Clips-User $remote_user;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name radar.ftfenaux.com;
    location ^~ /api/newsletter { return 410; }

    location = /newsletter { return 410; }

    location ^~ /newsletter-images/ { return 410; }

    location ^~ /newsletter/ { return 410; }

    location ^~ /_next/ { return 410; }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 1800s;
    }

    location / {
        auth_basic "IVT Radar";
        auth_basic_user_file /etc/nginx/ivt-radar.htpasswd;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
    }
}
