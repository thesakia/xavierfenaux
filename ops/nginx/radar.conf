server {
    if ($ft_services_retired) { return 410; }
    server_name radar.ftfenaux.com;
    include /etc/nginx/snippets/xavier-master-endpoints.conf;
    location @master_radar_login {
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        return 302 https://xavierfenaux.com/master/launch.php?tool=ivt-radar;
    }
    location @master_newsletter_login {
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        return 302 https://xavierfenaux.com/master/launch.php?tool=ivt-newsletter;
    }
    location = /newsletter {
        auth_request /__master/check;
        auth_request_set $master_basic $upstream_http_x_master_basic;
        proxy_set_header Authorization $master_basic;
        error_page 401 = @master_newsletter_login;
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location ^~ /newsletter-images/ {
        auth_basic off;
        proxy_pass http://169.58.52.139;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /newsletter/ {
        auth_request /__master/check;
        auth_request_set $master_basic $upstream_http_x_master_basic;
        proxy_set_header Authorization $master_basic;
        error_page 401 = @master_newsletter_login;
        # Preserve the /newsletter basePath compiled into the application.
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location ^~ /_next/ {
        auth_request /__master/check;
        auth_request_set $master_basic $upstream_http_x_master_basic;
        proxy_set_header Authorization $master_basic;
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location / {
        auth_request /__master/check;
        auth_request_set $master_basic $upstream_http_x_master_basic;
        proxy_set_header Authorization $master_basic;
        error_page 401 = @master_radar_login;
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }
    location /api/ {
        auth_request /__master/check;
        auth_request_set $master_basic $upstream_http_x_master_basic;
        proxy_set_header Authorization $master_basic;
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_read_timeout 1800s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/radar.ftfenaux.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/radar.ftfenaux.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($ft_services_retired) { return 410; }
    if ($host = radar.ftfenaux.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name radar.ftfenaux.com;
    return 404; # managed by Certbot


}
