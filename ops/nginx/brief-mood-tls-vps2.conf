server {
    listen 8791 ssl;
    server_name brief-mood.internal;
    ssl_certificate /etc/nginx/brief-mood-upstream.crt;
    ssl_certificate_key /etc/nginx/brief-mood-upstream.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/brief-mood.conf;
    location / { return 404; }
}
