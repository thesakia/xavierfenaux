server {
    if ($ft_services_retired) { return 410; }
    server_name xavierfenaux.com www.xavierfenaux.com;

    root /var/www/xavierfenaux/www;
    index index.php index.html;

    access_log /var/log/nginx/xavierfenaux.access.log;
    error_log /var/log/nginx/xavierfenaux.error.log;
    include /etc/nginx/snippets/xavier-master-endpoints.conf;

    location @master_clips_login {
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        return 302 https://xavierfenaux.com/master/launch.php?tool=clips;
    }
    location @master_dashboard_login {
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        return 302 https://xavierfenaux.com/master/launch.php?tool=dashboard;
    }

    location ^~ /dashboard {
        auth_request /__master/dashboard;
        auth_request_set $master_dashboard $upstream_http_x_master_dashboard;
        proxy_set_header Cookie "xf_dashboard_session=$master_dashboard";
        error_page 401 = @master_dashboard_login;
        proxy_pass http://169.58.52.139/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://169.58.52.139/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        auth_request /__master/dashboard;
        auth_request_set $master_dashboard $upstream_http_x_master_dashboard;
        proxy_set_header Cookie "xf_dashboard_session=$master_dashboard";
        proxy_pass http://169.58.52.139/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /clips { return 301 /clips/; }

    location = /api/auth/login {
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/logout {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/xavierfenaux/www/master/tool-logout.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /api/webhooks/tradingview {
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /clips/hooks/ {
        proxy_pass http://169.58.52.139;
        proxy_set_header Host $host;
        client_max_body_size 100k;
        access_log off;
    }

    location ^~ /clips/ {
        auth_request /__master/check;
        auth_request_set $master_basic $upstream_http_x_master_basic;
        error_page 401 = @master_clips_login;
        proxy_pass http://169.58.52.139;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $master_basic;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1000m;
        client_body_timeout 600s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 600s;
    }

    location ^~ /ivtday-ws {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }


    location ^~ /ivtday/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ [.]php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /[.] {
        deny all;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xavierfenaux.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xavierfenaux.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($ft_services_retired) { return 410; }
    if ($host = www.xavierfenaux.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = xavierfenaux.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name xavierfenaux.com www.xavierfenaux.com;
    return 404;
}
