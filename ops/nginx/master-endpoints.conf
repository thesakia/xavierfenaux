location = /__master/check {
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/xavierfenaux/www/master/access-check.php;
    fastcgi_param MASTER_AUTH_REQUEST 1;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_pass_request_body off;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
location = /__master/complete {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/xavierfenaux/www/master/sso-callback.php;
    fastcgi_param MASTER_SSO_CALLBACK 1;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    access_log off;
}
