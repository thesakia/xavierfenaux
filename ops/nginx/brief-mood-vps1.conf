location = /brief-mood { return 301 /brief-mood/; }
location @master_brief_login {
    if ($request_method !~ ^(GET|HEAD)$) { return 401; }
    return 302 https://xavierfenaux.com/master/launch.php?tool=brief-mood;
}
location ^~ /brief-mood/ {
    auth_request /__master/check;
    auth_request_set $brief_basic $upstream_http_x_master_basic;
    error_page 401 = @master_brief_login;
    proxy_pass https://169.58.52.139:8791;
    proxy_ssl_server_name on;
    proxy_ssl_name brief-mood.internal;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/brief-mood-upstream.crt;
    proxy_set_header Host $host;
    proxy_set_header Authorization $brief_basic;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    client_max_body_size 100k;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
